<div class="table-inline">
  <div class="tab-title">
    {{ config.title }}
  </div>
  <p-button
    pRipple
    [outlined]="true"
    styleClass="p-button-text"
    icon="pi pi-plus"/>
</div>
<p-table
  [value]="config.values"
  dataKey="id"
  [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header let-columns>
    <tr>
      <th style="width: 10%;text-align: center">
        Ações
      </th>
      <th [style]="'width:' + col.width " *ngFor="let col of config.columns">
        {{ col.header }}
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-values let-editing="editing">
    <tr>
      <td [pEditableColumn]="values.id" pEditableColumnField="code">
        <p-cellEditor>
          <ng-template #input>
            <input
              pInputText
              type="text"
              [(ngModel)]="values.id" />
          </ng-template>
          <ng-template #output>
            {{ values.id }}
          </ng-template>
        </p-cellEditor>
      </td>
      <td [pEditableColumn]="values.name" pEditableColumnField="code">
        <p-cellEditor>
          <ng-template #input>
            <input
              pInputText
              type="text"
              [(ngModel)]="values.name" />
          </ng-template>
          <ng-template #output>
            {{ values.code }}
          </ng-template>
        </p-cellEditor>
      </td>
      <td [pEditableColumn]="values.teste" pEditableColumnField="code">
        <p-cellEditor>
          <ng-template #input>
            <input
              pInputText
              type="text"
              [(ngModel)]="values.teste" />
          </ng-template>
          <ng-template #output>
            {{ values.code }}
          </ng-template>
        </p-cellEditor>
      </td>
    </tr>
  </ng-template>
</p-table>
